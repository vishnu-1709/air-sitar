<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0806" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Laser Strings</title>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <div id="start" class="overlay">
      <h1>LASER STRINGS</h1>
      <button id="startBtn">Tap to start</button>
      <p id="msg"></p>
    </div>
    <pre id="debug"></pre>
    <div id="flags" style="display:none"></div>
    <div id="savePanel" class="hidden">
      <span id="saveInfo"></span>
      <button id="saveBtn">Save video</button>
      <button id="discardBtn">Discard</button>
    </div>
    <div id="controls" class="hidden">
      <button id="modeBtn">Snap</button>
      <select id="scaleSel" aria-label="Scale"></select>
      <button id="beatBtn">Beat ▶</button>
      <button id="recBtn">● Rec</button>
    </div>
  </div>
  <div id="rotate">Rotate your phone to landscape</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
